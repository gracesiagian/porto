<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Ambient Soft Glow behind -->
  <circle cx="128" cy="128" r="80" fill="#a5b4fc" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Back of Planetary Ring -->
  <ellipse cx="128" cy="128" rx="104" ry="42" fill="none" stroke="url(#ringGrad)" stroke-width="14" opacity="0.85" transform="rotate(-20 128 128)"/>

  <!-- Planet Sphere -->
  <circle cx="128" cy="128" r="64" fill="url(#planetGrad)" filter="url(#glow)"/>

  <!-- Front of Planetary Ring (clipped to show depth) -->
  <path d="M 28 164 C 40 205 180 215 228 92" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Sparkles / Stars -->
  <path d="M 50 60 Q 50 70 40 70 Q 50 70 50 80 Q 50 70 60 70 Q 50 70 50 60 Z" fill="#fef08a"/>
  <path d="M 210 50 Q 210 58 202 58 Q 210 58 210 66 Q 210 58 218 58 Q 210 58 210 50 Z" fill="#fef08a"/>
  <circle cx="190" cy="190" r="4" fill="#fef08a"/>
  <circle cx="70" cy="200" r="3" fill="#fef08a"/>
</svg>
